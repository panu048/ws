<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - NPRU Cafe</title>
  <link rel="stylesheet" href="./css/darklight.css">
</head>
<body class="login-page">

  <div class="container">
    <div id="loginCard" class="card">
      <h2>เข้าสู่ระบบ</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้ (Username):</label>
          <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน (Password):</label>
          <input type="password" id="password" placeholder="กรอกรหัสผ่าน" minlength="4" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="showPassword" style="width:auto;">
            แสดงรหัสผ่าน
          </label>
        </div>

        <div class="form-group">
          <label for="themeSelect">เลือกธีมที่ต้องการ:</label>
          <select id="themeSelect">
            <option value="light">Light Theme (สว่าง)</option>
            <option value="dark">Dark Theme (มืด)</option>
          </select>
        </div>

        <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>

  <script src="./js/login.js"></script>
</body>
</html>
