<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสินค้า - NPRU Cafe</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="user-bar">
        <div class="user-info">
            <span>ยินดีต้อนรับ: <strong id="displayName">-</strong> (Admin)</span>
        </div>
        <div class="user-actions">
            <a href="index.html" class="nav-btn">🏠 กลับหน้าร้านค้า</a>
            <button id="logoutBtn" class="btn-logout">ออกจากระบบ</button>
        </div>
    </header>

    <div class="main-layout">
        
        <!-- ฟอร์มเพิ่มสินค้า (ฝั่งซ้าย) -->
        <div class="left-content">
            <div class="add-product-section">
                <h2>➕ เพิ่มรายการสินค้าใหม่</h2>
                <form id="add-menu-form">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="ชื่อสินค้า" required>
                    </div>
                    <div class="form-group">
                        <input type="number" step="0.01" id="price" placeholder="ราคา (บาท)" required>
                    </div>
                    <div class="form-group">
                        <select id="type">
                            <option value="">เลือกประเภท (เครื่องดื่ม)</option>
                            <option value="Hot">ร้อน</option>
                            <option value="iced">เย็น</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="cat" required>
                            <option value="">เลือกหมวดหมู่</option>
                            <option value="drink">เครื่องดื่ม</option>
                            <option value="bakery">เบเกอรี่</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">บันทึกเพิ่มสินค้า</button>
                </form>
            </div>
        </div>

        <!-- รายการสินค้าทั้งหมดที่มีปุ่ม แก้ไข/ลบ (ฝั่งขวา) -->
        <div class="right-content full-width">
            <h2>📋 รายการสินค้าที่มีในระบบ</h2>
            <div id="admin-menu-list">กำลังโหลดรายการ...</div>
        </div>

    </div>

    <script src="./js/admin.js"></script>
</body>
</html>
